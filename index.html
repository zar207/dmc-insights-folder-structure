<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ellucian Insights — Folder Structure &amp; Roles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: #f7f6f3; color: #2c2c2a;
    padding: 32px; min-height: 100vh;
  }
  .container { max-width: 1040px; margin: 0 auto; }
  .header { margin-bottom: 32px; padding-bottom: 20px; border-bottom: 2px solid #d3d1c7; }
  .header h1 { font-size: 22px; font-weight: 600; color: #1a1a18; letter-spacing: -0.3px; }
  .header p { font-size: 13px; color: #7a7970; margin-top: 6px; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;
    padding: 14px 18px; background: #efeee9; border-radius: 8px;
  }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: #5f5e5a; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-sep { width: 1px; height: 20px; background: #ccc9be; }

  .tree ul { list-style: none; padding-left: 0; }
  .tree ul ul { padding-left: 28px; }
  .tree li { position: relative; }
  .tree ul ul li::before {
    content: ''; position: absolute; left: -16px; top: 0; bottom: 50%;
    width: 1px; background: #ccc9be;
  }
  .tree ul ul li::after {
    content: ''; position: absolute; left: -16px; top: 50%;
    width: 12px; height: 1px; background: #ccc9be;
  }
  .tree ul ul li:last-child::before { bottom: 50%; }
  .tree ul ul > li:not(:last-child)::before { bottom: 0; }

  .node {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 14px; margin: 3px 0; border-radius: 8px;
    transition: background .15s; user-select: none;
    min-height: 42px;
  }
  .node.has-children {
    cursor: pointer;
    border: 1px solid transparent;
  }
  .node.has-children:hover {
    background: rgba(55,138,221,.06);
    border-color: rgba(55,138,221,.2);
  }
  .node.has-children:active { background: rgba(55,138,221,.12); }
  .node:not(.has-children) { padding-left: 44px; }
  .node-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .toggle-btn {
    width: 28px; height: 28px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px; border: none; background: transparent;
    cursor: pointer; transition: all .15s; padding: 0;
  }
  .toggle-btn:hover { background: rgba(55,138,221,.12); }
  .chevron {
    width: 18px; height: 18px; flex-shrink: 0;
    transition: transform .2s; color: #666;
  }
  .chevron.collapsed { transform: rotate(-90deg); }
  .icon { width: 18px; height: 18px; flex-shrink: 0; }
  .node-name { font-size: 14px; font-weight: 500; color: #2c2c2a; white-space: nowrap; }
  .node.root .node-name { font-size: 15px; font-weight: 600; }
  .node.data-model .node-name {
    font-weight: 400; font-family: 'IBM Plex Mono', monospace;
    font-size: 13px; color: #534ab7;
  }
  .count-badge { font-size: 10px; color: #aaa89f; font-weight: 400; margin-left: 4px; }

  .roles-badges {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-left: auto; padding-left: 12px;
  }
  .badge {
    font-size: 9px; font-weight: 500; padding: 2px 6px;
    border-radius: 4px; white-space: nowrap; letter-spacing: 0.1px;
  }
  .badge.viewer { background: #e1f5ee; color: #085041; }
  .badge.editor { background: #e6f1fb; color: #0c447c; }
  .badge.writer { background: #eeedfe; color: #3c3489; }
  .badge.admin  { background: #faeeda; color: #633806; }
  .badge.expert { background: #faece7; color: #712b13; }
  .badge.none   { background: #f1efe8; color: #888780; font-style: italic; }

  .children { overflow: hidden; }
  .children.collapsed { display: none; }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .ctrl-btn {
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border: 1px solid #ccc9be;
    border-radius: 6px;
    background: #fff;
    color: #5f5e5a;
    cursor: pointer;
    transition: all .15s;
  }
  .ctrl-btn:hover { background: #efeee9; border-color: #aaa89f; color: #2c2c2a; }

  @media (max-width: 700px) {
    body { padding: 16px; }
    .roles-badges { display: none; }
    .tree ul ul { padding-left: 20px; }
  }
  @media print {
    body { background: #fff; padding: 16px; }
    .node:hover { background: none; }
    .children.collapsed { display: block !important; }
    .chevron { display: none; }
    .controls { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Ellucian Insights — Folder structure &amp; role assignments</h1>
    <p>Del Mar College &middot; Click folders to expand/collapse &middot; Role badges show assigned access</p>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#1d9e75"></span> Institution root</div>
    <div class="legend-item"><span class="legend-dot" style="background:#378add"></span> Department</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ba7517"></span> Collection</div>
    <div class="legend-item"><span class="legend-dot" style="background:#7f77dd"></span> Data models</div>
    <div class="legend-sep"></div>
    <div class="legend-item"><span class="badge viewer">Viewer</span></div>
    <div class="legend-item"><span class="badge editor">Editor</span></div>
    <div class="legend-item"><span class="badge writer">Writer</span></div>
    <div class="legend-item"><span class="badge expert">Expert</span></div>
    <div class="legend-item"><span class="badge admin">Admin</span></div>
  </div>
  <div class="controls">
    <button class="ctrl-btn" onclick="toggleAll(false)">Expand all</button>
    <button class="ctrl-btn" onclick="toggleAll(true)">Collapse all</button>
  </div>
  <div class="tree"><ul id="root"></ul></div>
</div>

<script>
var V = "viewer", E = "editor", W = "writer", A = "admin", X = "expert";

function R(name) {
  var k = "none";
  if (name.indexOf("VIEWER") !== -1) k = V;
  else if (name.indexOf("EDITOR") !== -1) k = E;
  else if (name.indexOf("WRITER") !== -1) k = W;
  else if (name.indexOf("ADMINISTRATOR") !== -1) k = A;
  else if (name.indexOf("EXPERT") !== -1) k = X;
  return {t: name, k: k};
}

var data = {
  name: "Del Mar College", type: "root", roles: [],
  children: [
    { name: "Continuing Education", type: "branch", roles: [],
      children: [
        { name: "Corporate Services", type: "leaf",
          roles: [R("CS INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] },
        { name: "Transportation", type: "leaf",
          roles: [R("CS INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] }
    ]},
    { name: "Finance", type: "branch", roles: [],
      children: [
        { name: "Accounts Payable", type: "branch",
          roles: [R("CE INSIGHTS REPORT VIEWER"), R("CF INSIGHTS REPORT EDITOR"), R("INSIGHTS ADMINISTRATOR")],
          children: [
            { name: "Accounts Payable Data Models", type: "data-model",
              roles: [R("CF INSIGHTS REPORT VIEWER"), R("CF INSIGHTS REPORT EDITOR"), R("INSIGHTS ADMINISTRATOR")] }
        ]},
        { name: "Budget", type: "branch",
          roles: [R("CS INSIGHTS REPORT VIEWER"), R("CF INSIGHTS REPORT EDITOR"), R("INSIGHTS ADMINISTRATOR")],
          children: [
            { name: "Budget Data Models", type: "data-model",
              roles: [R("CF INSIGHTS REPORT VIEWER"), R("CS INSIGHTS REPORT EDITOR"), R("INSIGHTS ADMINISTRATOR")] }
        ]},
        { name: "Grants", type: "branch",
          roles: [R("CF INSIGHTS REPORT VIEWER"), R("CF INSIGHTS REPORT EDITOR"), R("INSIGHTS ADMINISTRATOR")],
          children: [
            { name: "Grants Data Models", type: "data-model",
              roles: [R("CE INSIGHTS REPORT VIEWER"), R("CF INSIGHTS REPORT EDITOR"), R("INSIGHTS ADMINISTRATOR")] }
        ]},
        { name: "Property Accounting", type: "branch",
          roles: [R("INSIGHTS ADMINISTRATOR")],
          children: [
            { name: "Property Accounting Data Models", type: "data-model",
              roles: [R("INSIGHTS ADMINISTRATOR")] }
        ]},
        { name: "Purchasing", type: "leaf",
          roles: [R("PU INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] },
        { name: "Student Accounts", type: "leaf",
          roles: [R("BU INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] }
    ]},
    { name: "Financial Aid", type: "leaf",
      roles: [R("FA INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] },
    { name: "Human Resources", type: "branch", roles: [],
      children: [
        { name: "Human Resources", type: "branch",
          roles: [R("HR INSIGHTS REPORT EDITOR"), R("HR INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR"), R("INSIGHTS REPORT EXPERT")],
          children: [
            { name: "Payroll", type: "branch",
              roles: [R("CF INSIGHTS REPORT EDITOR"), R("HR INSIGHTS REPORT EDITOR"), R("HR INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR"), R("INSIGHTS REPORT EXPERT"), R("PU INSIGHTS REPORT EDITOR"), R("PU INSIGHTS REPORT VIEWER")],
          children: [
            { name: "Payroll Data Models", type: "data-model",
              roles: [R("CS INSIGHTS REPORT EDITOR"), R("HR INSIGHTS REPORT EDITOR"), R("HR INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR"), R("INSIGHTS REPORT EXPERT"), R("PU INSIGHTS REPORT EDITOR"), R("PR INSIGHTS REPORT VIEWER")] }
        ]}
      ]}
    ]},
    { name: "Institutional Research", type: "leaf",
      roles: [R("IT INSIGHTS REPORT WRITER"), R("INSIGHTS REPORT WRITER"), R("INSIGHTS ADMINISTRATOR")] },
    { name: "Institutional Reports", type: "leaf",
      roles: [R("INSIGHTS ADMINISTRATOR")] },
    { name: "Information Technology", type: "leaf",
      roles: [R("INSIGHTS ADMINISTRATOR"), R("IR INSIGHTS REPORT WRITER")] },
    { name: "Public", type: "leaf",
      roles: [R("FA INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] },
    { name: "Student Enrollment Center", type: "leaf",
      roles: [R("AD INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] },
    { name: "Student Records Office", type: "leaf",
      roles: [R("SR INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] },
    { name: "Veteran's Office", type: "leaf",
      roles: [R("VA INSIGHTS REPORT VIEWER"), R("INSIGHTS ADMINISTRATOR")] }
  ]
};

var iconColors = { root:"#1d9e75", branch:"#378add", leaf:"#ba7517", "data-model":"#7f77dd" };

function folderSVG(color) {
  return '<svg class="icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M2 5v9a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0016 14V7.5A1.5 1.5 0 0014.5 6H9.5L8 4H3.5A1.5 1.5 0 002 5z" fill="' + color + '" opacity="0.2" stroke="' + color + '" stroke-width="1.2"/></svg>';
}
function dbSVG(color) {
  return '<svg class="icon" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<ellipse cx="9" cy="5" rx="6" ry="2.5" fill="' + color + '" opacity="0.2" stroke="' + color + '" stroke-width="1.1"/>' +
    '<path d="M3 5v8c0 1.38 2.69 2.5 6 2.5s6-1.12 6-2.5V5" stroke="' + color + '" stroke-width="1.1" fill="none"/>' +
    '<path d="M3 9c0 1.38 2.69 2.5 6 2.5s6-1.12 6-2.5" stroke="' + color + '" stroke-width="1.1" fill="none"/></svg>';
}
function chevronSVG() {
  return '<svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>';
}

function buildTree(node, parent) {
  var li = document.createElement('li');
  var hasKids = node.children && node.children.length > 0;
  var color = iconColors[node.type] || "#888";

  var div = document.createElement('div');
  div.className = 'node ' + node.type;
  if (hasKids) div.classList.add('has-children');

  var left = document.createElement('div');
  left.className = 'node-left';

  if (hasKids) {
    var btn = document.createElement('button');
    btn.className = 'toggle-btn';
    btn.innerHTML = chevronSVG();
    btn.title = 'Click to expand/collapse';
    left.appendChild(btn);
  }

  var icon = document.createElement('span');
  icon.innerHTML = node.type === 'data-model' ? dbSVG(color) : folderSVG(color);
  left.appendChild(icon);

  var name = document.createElement('span');
  name.className = 'node-name';
  name.textContent = node.name;
  left.appendChild(name);

  if (hasKids) {
    var cnt = document.createElement('span');
    cnt.className = 'count-badge';
    cnt.textContent = node.children.length;
    left.appendChild(cnt);
  }
  div.appendChild(left);

  if (node.roles && node.roles.length) {
    var badges = document.createElement('div');
    badges.className = 'roles-badges';
    node.roles.forEach(function(r) {
      var b = document.createElement('span');
      b.className = 'badge ' + r.k;
      b.textContent = r.t;
      badges.appendChild(b);
    });
    div.appendChild(badges);
  } else if (!hasKids) {
    var badges = document.createElement('div');
    badges.className = 'roles-badges';
    var b = document.createElement('span');
    b.className = 'badge none';
    b.textContent = 'No roles assigned';
    badges.appendChild(b);
    div.appendChild(badges);
  }

  li.appendChild(div);

  if (hasKids) {
    var ul = document.createElement('ul');
    ul.className = 'children';
    node.children.forEach(function(c) { buildTree(c, ul); });
    li.appendChild(ul);
    div.addEventListener('click', function() {
      var collapsed = ul.classList.toggle('collapsed');
      btn.querySelector('.chevron').classList.toggle('collapsed', collapsed);
    });
  }
  parent.appendChild(li);
}

buildTree(data, document.getElementById('root'));

function toggleAll(collapse) {
  document.querySelectorAll('.children').forEach(function(ul) {
    ul.classList.toggle('collapsed', collapse);
  });
  document.querySelectorAll('.toggle-btn .chevron').forEach(function(chev) {
    chev.classList.toggle('collapsed', collapse);
  });
}
</script>
</body>
</html>
